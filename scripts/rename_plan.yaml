# 为什么要改：名字对不上，设备就控制不了。实测卧室风扇 `风扇␠␠风扇` 打开成功率
# 0/6，改成「卧室风扇」后 4/4；书房空调同理。详见 docs/voice-tuning.md。
#
# 规则（voice-tuning.md 第二节）：
#   R1 说得出口 —— 你会这么跟人说话吗
#   R2 区域 + 负载，不带控制器 —— 用户关心被控的东西，不关心哪面墙上的面板
#   R3 同区域内避开同音近音；跨区域同名负载才加区域前缀
#   R4 去掉「左键/中键/右键」「开关 开关」这类技术词（**只改名，不要动实体**）
#
# 跑法： python scripts/apply_rename.py --dry-run    只看不改
#        python scripts/apply_rename.py             真改（可 --undo 回滚）

